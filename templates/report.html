<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced APK Security Scanner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: #e8edf7;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }
        h1, h2, h3 {
            color: #ffffff;
        }
        .subtitle {
            color: #b4c4dd;
        }
        .upload-form {
            background: #121b2d;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            margin: 20px 0;
        }
        input[type="file"] {
            display: block;
            margin: 15px 0;
            color: #d9e7ff;
        }
        button {
            background: linear-gradient(135deg, #4f8cff, #6d5ef7);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background: #111a2b;
            border: 1px solid #1d2b43;
            padding: 20px;
            border-radius: 10px;
        }
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .alert-danger {
            background: rgba(255, 77, 77, 0.12);
            border: 1px solid rgba(255, 77, 77, 0.4);
            color: #ffd7d7;
        }
        .summary {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin: 20px 0;
        }
        .metric {
            background: #111a2b;
            padding: 16px 20px;
            border-radius: 10px;
            min-width: 140px;
        }
        .metric strong {
            font-size: 28px;
            display: block;
        }
        .finding {
            background: #121b2d;
            margin: 16px 0;
            padding: 18px;
            border-radius: 10px;
            border-left: 4px solid #6d5ef7;
        }
        .severity {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .severity.critical { background: #d62246; color: white; }
        .severity.high { background: #ff8d3a; color: #fff; }
        .severity.medium { background: #f7c948; color: #221d08; }
        .severity.low { background: #3f9d75; color: white; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #1d2b43;
        }
        a {
            color: #8cb4ff;
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
